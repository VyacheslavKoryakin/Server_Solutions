<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Список автомобилей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container mt-4">
    <h1>Автомобили</h1>


    <form th:action="@{/car/getById}" method="get" class="mb-4 row g-3">
        <div class="col-auto">
            <input type="number" name="id" class="form-control" placeholder="Введите ID автомобиля" required>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Найти по ID</button>
        </div>
    </form>


    <a th:href="@{/car/list}" class="btn btn-secondary mb-3">Показать все автомобили</a>


    <div th:if="${cars != null}">
        <h2 th:text="${cars.size() > 0} ? 'Список автомобилей' : 'Автомобили не найдены'"></h2>
        <table th:if="${cars.size() > 0}" class="table table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Марка</th>
                <th>Модель</th>


            </tr>
            </thead>
            <tbody>
            <tr th:each="car : ${cars}">
                <td th:text="${car.id}">ID</td>
                <td th:text="${car.getCarManufacturer()}">Марка</td>
                <td th:text="${car.getModel()}">Модель</td>

            </tr>
            </tbody>
        </table>
    </div>


    <div th:if="${car != null}">
        <h2>Автомобиль по ID</h2>
        <table class="table table-bordered">
            <tr>
                <th>ID</th>
                <td th:text="${car.id}"></td>
            </tr>
            <tr>
                <th>Марка</th>
                <td th:text="${car.getCarManufacturer()}"></td>
            </tr>
            <tr>
                <th>Модель</th>
                <td th:text="${car.model}"></td>
            </tr>


        </table>
    </div>

</div>
</body>
</html>
